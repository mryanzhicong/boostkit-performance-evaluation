name: folly
category: HPC
enabled: true
versions:
  - "2022.11.14.00"
test_tools:
  AccLibBenchmark:
    version: unknown
  fbthrift:
    version: "2022.11.14.00"
execution:
  type: shell-functions
  stages:
    build:
      script: folly_test.sh
      function: build_folly
    start:
      script: folly_test.sh
      function: start_folly_runtime
    test:
      script: folly_test.sh
      function: run_folly_benchmarks
    stop:
      script: folly_test.sh
      function: stop_folly_runtime
  timeout_minutes: 720
outputs:
  benchmark_result:
    path: benchmark_folly.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
