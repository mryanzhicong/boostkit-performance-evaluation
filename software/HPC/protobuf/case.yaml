name: protobuf
category: HPC
enabled: true
versions:
  - "35.1"
execution:
  type: shell-functions
  environment:
    NUM_MESSAGES: 200000
    ITERATIONS: 5
    MESSAGE_SIZE: 100
    THREAD_COUNTS: 1,2,4,8
    PROTOBUF_PYTHON_VERSION: 7.35.1
  stages:
    build:
      script: protobuf_test.sh
      function: build_protobuf
    start:
      script: protobuf_test.sh
      function: start_protobuf_runtime
    test:
      script: protobuf_test.sh
      function: run_protobuf_benchmarks
    stop:
      script: protobuf_test.sh
      function: stop_protobuf_runtime
  timeout_minutes: 120
outputs:
  serialization_benchmark:
    path: benchmark_ann.json
    stage: test
    format: json
    required: true
  micro_benchmark:
    path: micro_benchmark.json
    stage: test
    format: json
    required: true
  aggregate_result:
    path: aggregate_results.json
    stage: test
    format: json
    required: true
metrics:
  source: aggregate_result
  collection:
    path: metrics
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
