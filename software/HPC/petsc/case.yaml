name: petsc
category: HPC
enabled: true
tags: [scientific-computing, linear-algebra]
versions: ["3.25.3"]
execution:
  type: command
  entrypoint: petsc_test.sh
  expected_outputs:
    - version_info.json
    - benchmark_generic.json
    - micro_benchmark.json
    - results.json
    - results.txt
    - results.log
modes:
  smoke:
    timeout_minutes: 60
    environment: {ITERATIONS: 1}
  full:
    timeout_minutes: 180
    environment: {ITERATIONS: 5}
metrics:
  average_time:
    source: results.json
    path: summary.avg_time_s
    unit: s
    direction: lower_is_better
