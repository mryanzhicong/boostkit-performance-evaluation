name: rapidjson
category: HPC
enabled: true
versions:
  - "1.1.0"
test_tools:
  rapidjson:
    version: "1.1.0 (commit 24b5e7a8b27f42fa16b96fc70aade9106cf7102f)"
  kunpeng_opti_patch:
    version: "v1.0.0 (boostkit/rapidjson master, 12,053 bytes)"
  googletest:
    version: "release-1.12.1"
  perftest:
    version: "upstream test/perftest (rapidjson 1.1.0)"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_rapidjson
    start:
      script: scripts/stages/start.sh
      function: start_rapidjson_runtime
    test:
      script: scripts/stages/test.sh
      function: run_rapidjson_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_rapidjson_runtime
  timeout_minutes: 180
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: perftest_result.json
    stage: test
    format: json
    required: true
  validation_log:
    path: unittest.log
    stage: test
    format: text
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
