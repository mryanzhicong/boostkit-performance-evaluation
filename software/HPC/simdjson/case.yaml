name: simdjson
category: HPC
enabled: true
versions:
  - "4.6.11"
test_tools:
  simdjson:
    version: "4.6.11"
  google_benchmark:
    version: "1.9.5"
  simdjson_data:
    version: "351949906abde446f0314bf79606fb5d884f5be7"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_simdjson
    start:
      script: scripts/stages/start.sh
      function: start_simdjson_runtime
    test:
      script: scripts/stages/test.sh
      function: run_simdjson_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_simdjson_runtime
  timeout_minutes: 180
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_google:
    path: benchmark_google.json
    stage: test
    format: json
    required: true
  benchmark_result:
    path: benchmark_simdjson.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
