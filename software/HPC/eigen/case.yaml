name: eigen
category: HPC
enabled: true
versions:
  - "5.0.1"
execution:
  type: shell-functions
  stages:
    build:
      script: eigen_test.sh
      function: build_eigen
    start:
      script: eigen_test.sh
      function: start_eigen_runtime
    test:
      script: eigen_test.sh
      function: run_eigen_benchmarks
    stop:
      script: eigen_test.sh
      function: stop_eigen_runtime
  timeout_minutes: 90
outputs:
  primary_benchmark:
    path: benchmark_perf_monitoring.json
    stage: test
    format: json
    required: true
metrics:
  source: primary_benchmark
  collection:
    path: results
    value_path: gflops_median
    group_path: command_display
    unit: GFLOPS
    direction: higher_is_better
