name: lz4
category: HPC
enabled: true
versions:
  - "1.9.3"
  - "1.10.0"
execution:
  type: shell-functions
  stages:
    build:
      script: lz4_test.sh
      function: build_lz4
    start:
      script: lz4_test.sh
      function: start_lz4_runtime
    test:
      script: lz4_test.sh
      function: run_lz4_benchmarks
    stop:
      script: lz4_test.sh
      function: stop_lz4_runtime
  timeout_minutes: 10
outputs:
  primary_benchmark:
    path: benchmark_fullbench.json
    stage: test
    format: json
    required: true
metrics:
  source: primary_benchmark
  definitions:
    "B4/1-LZ4_compress_default":
      path: results.B4.1-LZ4_compress_default.speed_mbs
      unit: MB/s
      direction: higher_is_better
    "B4/4-LZ4_decompress_safe":
      path: results.B4.4-LZ4_decompress_safe.speed_mbs
      unit: MB/s
      direction: higher_is_better
    "B7/1-LZ4_compress_default":
      path: results.B7.1-LZ4_compress_default.speed_mbs
      unit: MB/s
      direction: higher_is_better
    "B7/4-LZ4_decompress_safe":
      path: results.B7.4-LZ4_decompress_safe.speed_mbs
      unit: MB/s
      direction: higher_is_better
