name: opencv
category: HPC
enabled: true
versions:
  - "5.0.0"
execution:
  type: shell-functions
  stages:
    build:
      script: opencv_test.sh
      function: build_opencv
    start:
      script: opencv_test.sh
      function: start_opencv_runtime
    test:
      script: opencv_test.sh
      function: run_opencv_benchmarks
    stop:
      script: opencv_test.sh
      function: stop_opencv_runtime
  timeout_minutes: 180
outputs:
  primary_benchmark:
    path: benchmark_opencv_perf.json
    stage: test
    format: json
    required: true
metrics:
  source: primary_benchmark
  collection:
    path: results
    value_path: median_ms
    group_path: module
    unit: ms
    direction: lower_is_better
