name: spdk
category: Acceleration
enabled: true
versions:
  - "26.09"
test_tools:
  bdevperf:
    version: "26.09"
  DPDK:
    version: "26.03.0"
  ISA-L:
    version: "7c3479e0a9dac17f448603ec1ad64c7c625f530c"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_spdk
    start:
      script: scripts/stages/start.sh
      function: start_spdk_runtime
    test:
      script: scripts/stages/test.sh
      function: run_spdk_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_spdk_runtime
  timeout_minutes: 180
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_raw.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_spdk.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
