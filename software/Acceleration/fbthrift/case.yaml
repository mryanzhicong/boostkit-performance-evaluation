name: fbthrift
category: Acceleration
enabled: true
versions:
  - "2026.10.26.00"
test_tools:
  ProtocolBench:
    version: "2026.10.26.00"
    revision: c7fdfc9a80aa162c3934bf325c8e6ba56d15e845
  GoogleBenchmark:
    version: "1.9.5"
  folly:
    version: "2026.10.26.00"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_fbthrift
    start:
      script: scripts/stages/start.sh
      function: start_fbthrift_runtime
    test:
      script: scripts/stages/test.sh
      function: run_fbthrift_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_fbthrift_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_raw.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_fbthrift.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
