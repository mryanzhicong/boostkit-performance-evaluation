name: eigen
category: Acceleration
enabled: true
versions:
  - "5.0.1"
test_tools:
  eigen_bench_gemm:
    version: "5.0.1"
    revision: "bench/bench_gemm.cpp that ships inside the pinned Eigen 5.0.1 release archive, compiled with -O3 -DNDEBUG -std=c++17 inside the private container"
  system_cxx_compiler:
    version: "unpinned Runner c++; the exact compiler string is recorded per run in build_info.json and results.json"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_eigen
    start:
      script: scripts/stages/start.sh
      function: start_eigen_runtime
    test:
      script: scripts/stages/test.sh
      function: run_eigen_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_eigen_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
