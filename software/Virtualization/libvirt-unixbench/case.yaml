name: libvirt-unixbench
category: Virtualization
enabled: true
versions:
  - "6.0.1"
test_tools:
  unixbench:
    version: "6.0.1"
    revision: master
  libvirt:
    version: "9.10.0"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_libvirt_unixbench
    start:
      script: scripts/stages/start.sh
      function: start_libvirt_unixbench_runtime
    test:
      script: scripts/stages/test.sh
      function: run_libvirt_unixbench_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_libvirt_unixbench_runtime
  timeout_minutes: 480
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  vm_environment:
    path: vm-environment.txt
    stage: build
    format: text
    required: true
  benchmark_raw:
    path: benchmark_unixbench_raw.log
    stage: test
    format: text
    required: true
  official_results:
    path: unixbench-official
    stage: test
    format: directory
    required: true
  per_vm_scores:
    path: per-vm-scores.json
    stage: test
    format: json
    required: true
  benchmark_result:
    path: benchmark_unixbench.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
