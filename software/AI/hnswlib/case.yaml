name: hnswlib
category: AI
enabled: true
versions:
  - "0.7.0"
  - "0.8.0"
  - "0.9.0"
execution:
  type: shell-functions
  stages:
    build:
      script: hnswlib_test.sh
      function: build_hnswlib
    start:
      script: hnswlib_test.sh
      function: start_hnswlib_runtime
    test:
      script: hnswlib_test.sh
      function: run_hnswlib_benchmarks
    stop:
      script: hnswlib_test.sh
      function: stop_hnswlib_runtime
  timeout_minutes: 60
outputs:
  benchmark_hnswlib:
    path: benchmark_hnswlib.json
    stage: test
    format: json
    required: true
  benchmark_raw:
    path: hnswlib_ann_raw.log
    stage: test
    format: text
    required: true
metrics:
  source: benchmark_hnswlib
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
