name: tensorflow
category: AI
enabled: true
versions:
  - "2.20.0"
test_tools:
  tensorflow:
    version: "2.20.0"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_tensorflow
    start:
      script: scripts/stages/start.sh
      function: start_tensorflow_runtime
    test:
      script: scripts/stages/test.sh
      function: run_tensorflow_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_tensorflow_runtime
  timeout_minutes: 1440
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_raw.log
    stage: test
    format: text
    required: true
  benchmark_result_csv:
    path: tensorflow-benchmark/results.csv
    stage: test
    format: text
    required: true
  benchmark_evidence:
    path: tensorflow-benchmark
    stage: test
    format: directory
    required: true
  benchmark_result:
    path: benchmark_tensorflow.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
    subgroup_path: subgroup
