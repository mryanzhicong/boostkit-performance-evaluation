name: openviking
category: AI
enabled: true
tags: [context-database, file-system]
versions: ["0.4.4", "0.4.5"]
execution:
  type: command
  entrypoint: openviking_test.sh
  expected_outputs:
    - version_info.json
    - benchmark_context.json
    - micro_benchmark.json
    - results.json
    - results.txt
    - results.log
modes:
  smoke:
    timeout_minutes: 60
    environment: {ITERATIONS: 1}
  full:
    timeout_minutes: 180
    environment: {ITERATIONS: 5}
metrics:
  write_operations:
    source: results.json
    path: summary.overall_write_ops_per_sec
    unit: ops/s
    direction: higher_is_better
  read_operations:
    source: results.json
    path: summary.overall_read_ops_per_sec
    unit: ops/s
    direction: higher_is_better
