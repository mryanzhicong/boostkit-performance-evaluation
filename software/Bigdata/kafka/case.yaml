name: kafka
category: Bigdata
enabled: true
versions:
  - "2.5.0"
test_tools:
  kafka-producer-perf-test:
    version: "2.5.0"
  kafka-consumer-perf-test:
    version: "2.5.0"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_kafka
    start:
      script: scripts/stages/start.sh
      function: start_kafka_runtime
    test:
      script: scripts/stages/test.sh
      function: run_kafka_benchmark
    stop:
      script: scripts/stages/stop.sh
      function: stop_kafka_runtime
  timeout_minutes: 180
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_kafka_raw.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_kafka.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
