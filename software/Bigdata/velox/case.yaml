name: velox
category: Bigdata
enabled: true
versions:
- 1.3.0
test_tools:
  hive_testbench:
    version: tpcds release 2026-10-15
    revision: 5bd9edd86452ca27d9d2a34812f34d626168c449
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/adapter.sh
      function: build_velox
    start:
      script: scripts/adapter.sh
      function: start_velox
    test:
      script: scripts/adapter.sh
      function: test_velox
    stop:
      script: scripts/adapter.sh
      function: stop_velox
  timeout_minutes: 1440
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  versions:
    path: versions.json
    stage: build
    format: json
    required: true
  dataset:
    path: dataset.json
    stage: start
    format: json
    required: true
  timings:
    path: timings.jsonl
    stage: test
    format: text
    required: true
  benchmark_raw:
    path: benchmark_velox_raw.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_velox.json
    stage: test
    format: json
    required: true
  extension_sources:
    path: extension-sources.json
    stage: build
    format: json
    required: true
  extension_installed:
    path: extension-installed.json
    stage: build
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
