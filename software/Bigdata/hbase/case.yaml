name: hbase
category: Bigdata
enabled: true
versions:
  - "2.4.14"
test_tools:
  hbase-performance-evaluation:
    version: "2.4.14"
  hadoop:
    version: "3.3.6"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_hbase
    start:
      script: scripts/stages/start.sh
      function: start_hbase_runtime
    test:
      script: scripts/stages/test.sh
      function: run_hbase_benchmark
    stop:
      script: scripts/stages/stop.sh
      function: stop_hbase_runtime
  timeout_minutes: 300
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_hbase_raw.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_hbase.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
