name: doris
category: Bigdata
enabled: true
versions:
  - "2.1.2"
test_tools:
  doris-stream-load:
    version: "2.1.2"
  pymysql:
    version: "1.x (wheel, version recorded in build log)"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_doris
    start:
      script: scripts/stages/start.sh
      function: start_doris_runtime
    test:
      script: scripts/stages/test.sh
      function: run_doris_benchmark
    stop:
      script: scripts/stages/stop.sh
      function: stop_doris_runtime
  timeout_minutes: 300
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_doris_raw.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_doris.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
