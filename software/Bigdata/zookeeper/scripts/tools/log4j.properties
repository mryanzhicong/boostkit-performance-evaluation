# ZkBench 运行时的 log4j 降噪配置：放在 classpath（ZkBench.class 同目录）即可生效。
# 不加这份配置时，ZooKeeper 客户端会对每个连接打印 "No appenders could be found for logger"，
# 高并发下刷屏会淹没 CSV 结果行。
log4j.rootLogger=ERROR, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c: %m%n
log4j.logger.org.apache.zookeeper=ERROR
log4j.logger.org.apache.zookeeper.ClientCnxn=FATAL
log4j.logger.org.apache.zookeeper.ZooKeeper=FATAL
