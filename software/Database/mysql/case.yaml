name: mysql
category: Database
enabled: true
versions:
  - "8.0.46"
execution:
  type: shell-functions
  stages:
    build:
      script: mysql_test.sh
      function: build_mysql
    start:
      script: mysql_test.sh
      function: start_mysql_service
    test:
      script: mysql_test.sh
      function: run_mysql_benchmarks
    stop:
      script: mysql_test.sh
      function: stop_mysql_service
  timeout_minutes: 60
outputs:
  primary_benchmark:
    path: benchmark_mysql.json
    stage: test
    format: json
    required: true
  primary_raw_output:
    path: benchmark_mysql_raw.log
    stage: test
    format: text
    required: true
  micro_benchmark:
    path: micro_benchmark.json
    stage: test
    format: json
    required: true
  micro_raw_output:
    path: micro_benchmark_raw.log
    stage: test
    format: text
    required: true
  aggregate_result:
    path: results.json
    stage: test
    format: json
    required: true
metrics:
  source: aggregate_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
