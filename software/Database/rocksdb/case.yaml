name: rocksdb
category: Database
enabled: true
versions:
  - "11.8.1"
test_tools:
  db_bench:
    version: "RocksDB 11.8.1"
execution:
  type: shell-functions
  stages:
    build:
      script: rocksdb_test.sh
      function: build_rocksdb
    start:
      script: rocksdb_test.sh
      function: prepare_rocksdb_benchmark_data
    test:
      script: rocksdb_test.sh
      function: run_rocksdb_benchmarks
    stop:
      script: rocksdb_test.sh
      function: cleanup_rocksdb_benchmark_data
  timeout_minutes: 180
outputs:
  db_bench_raw_output:
    path: db_bench_raw.log
    stage: test
    format: text
    required: true
  aggregate_result:
    path: results.json
    stage: test
    format: json
    required: true
metrics:
  source: aggregate_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
