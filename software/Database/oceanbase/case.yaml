name: oceanbase
category: Database
enabled: true
versions:
  - "4.2.5.6"
test_tools:
  sysbench:
    version: "1.0.20"
  obproxy:
    version: "4.3.6.1"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_oceanbase
    start:
      script: scripts/stages/start.sh
      function: start_oceanbase_service
    test:
      script: scripts/stages/test.sh
      function: run_oceanbase_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_oceanbase_service
  timeout_minutes: 600
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  raw_benchmark_output:
    path: sysbench_raw.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
