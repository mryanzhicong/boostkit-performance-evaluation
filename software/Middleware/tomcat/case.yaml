name: tomcat
category: Middleware
enabled: true
versions:
  - "11.0.25"
environment:
  TOMCAT_RELEASE_BASE: https://dlcdn.apache.org/tomcat/tomcat-11
  TOMCAT_SHA512: 81339c046dff1b363a80a3bccf80cb391660a6828dd8ae042180ceb11c8b1614317143e60b311b9e791dab585bb046b777234667acce7dca2203a74b37bf20f2
  JDK_RELEASE_TAG: jdk-25.0.4.1+1
  JDK_X86_64_SHA256: dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e
  JDK_AARCH64_SHA256: 69df11a02cfa3ef7d7ca645e03edce6778ec090e100f6ae2b42097865730ac52
  K6_VERSION: "2.2.0"
  K6_X86_64_SHA256: b5a8003c86f35f5cd5ceef1490312c48e587696c94d998cefc6d7b3b4cb1597d
  K6_AARCH64_SHA256: 4ecd64cadcc792402d16293836115480419c4447c032858f564852d98f1bf54c
test_tools:
  jdk:
    version: 25.0.4.1
  k6:
    version: "2.2.0"
execution:
  type: shell-functions
  stages:
    build:
      script: tomcat_test.sh
      function: build_tomcat
    start:
      script: tomcat_test.sh
      function: start_tomcat_service
    test:
      script: tomcat_test.sh
      function: run_tomcat_benchmarks
    stop:
      script: tomcat_test.sh
      function: stop_tomcat_service
  timeout_minutes: 180
outputs:
  raw_benchmark_output:
    path: tomcat_k6_raw.log
    stage: test
    format: text
    required: true
  aggregate_result:
    path: results.json
    stage: test
    format: json
    required: true
metrics:
  source: aggregate_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    matrix:
      group_path: scenario
      row_path: vus
      row_label: 并发 VU 数
      column_path: source_field
      column_order:
        - RPS
        - avg latency
        - p95 latency
      single_note: RPS 为越大越好，avg latency 与 p95 latency 为越小越好。
