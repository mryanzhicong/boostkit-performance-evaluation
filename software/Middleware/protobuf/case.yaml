name: protobuf
category: Middleware
enabled: true
tags: [serialization, protocol]
versions: ["34.2", "35.0", "35.1"]
execution:
  type: command
  entrypoint: protobuf_test.sh
  expected_outputs:
    - version_info.json
    - benchmark_ann.json
    - micro_benchmark.json
    - results.json
    - results.txt
    - results.log
modes:
  smoke:
    timeout_minutes: 60
    environment: {NUM_MESSAGES: 1000, ITERATIONS: 1, BUILD_METHOD: pip}
  full:
    timeout_minutes: 180
    environment: {NUM_MESSAGES: 10000, ITERATIONS: 3, BUILD_METHOD: pip}
metrics:
  serialize_qps:
    source: results.json
    path: summary.single_serialize_qps
    unit: messages/s
    direction: higher_is_better
  deserialize_qps:
    source: results.json
    path: summary.single_deserialize_qps
    unit: messages/s
    direction: higher_is_better
