name: dpdk
category: Middleware
enabled: true
versions:
  - "26.07"
environment:
  DPDK_RELEASE_BASE: https://fast.dpdk.org/rel
  DPDK_OFFLINE_DIR: /home/runner/software/dpdk
execution:
  type: shell-functions
  stages:
    build:
      script: dpdk_test.sh
      function: build_dpdk
    start:
      script: dpdk_test.sh
      function: start_dpdk_runtime
    test:
      script: dpdk_test.sh
      function: run_dpdk_benchmarks
    stop:
      script: dpdk_test.sh
      function: stop_dpdk_runtime
  timeout_minutes: 120
outputs:
  raw_benchmark_output:
    path: dpdk_dataplane_raw.log
    stage: test
    format: text
    required: true
  aggregate_result:
    path: results.json
    stage: test
    format: json
    required: true
metrics:
  source: aggregate_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    matrix:
      group_path: workload
      row_path: threads
      row_label: 线程数
      column_path: source_field
      column_order:
        - ops/s
        - avg op
        - p99 op
      single_note: ops/s 为越大越好，avg op 与 p99 op 为越小越好（unit=ns）；ring 场景 1 op = 1 个元素入队+出队。
