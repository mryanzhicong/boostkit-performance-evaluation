name: ffmpeg
category: Media
enabled: true
versions:
  - "7.1.1"
test_tools:
  ffmpeg:
    version: "7.1.1"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_ffmpeg
    start:
      script: scripts/stages/start.sh
      function: start_ffmpeg_runtime
    test:
      script: scripts/stages/test.sh
      function: run_ffmpeg_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_ffmpeg_runtime
  timeout_minutes: 720
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_raw.log
    stage: test
    format: text
    required: true
  benchmark_result_csv:
    path: result_bench-ffmpeg.csv
    stage: test
    format: text
    required: true
  benchmark_evidence:
    path: benchmark_evidence
    stage: test
    format: directory
    required: true
  benchmark_result:
    path: benchmark_ffmpeg.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
    subgroup_path: subgroup
