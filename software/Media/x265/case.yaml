name: x265
category: Media
enabled: true
versions:
  - "4.2"
test_tools:
  x265:
    version: "与被测软件版本一致"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_x265
    start:
      script: scripts/stages/start.sh
      function: start_x265_runtime
    test:
      script: scripts/stages/test.sh
      function: run_x265_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_x265_runtime
  timeout_minutes: 1350
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  official_benchmark:
    path: benchmark_encode.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_x265.json
    stage: test
    format: json
    required: true
  reference_summary_single:
    path: video_fps_summary_x265-8core-1.csv
    stage: test
    format: text
    required: true
  reference_summary_whole_machine:
    path: video_fps_summary_x265-8core-whole-machine.csv
    stage: test
    format: text
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    group_path: group
    unit: fps
    direction: higher_is_better
