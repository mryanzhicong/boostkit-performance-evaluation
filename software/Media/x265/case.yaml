name: x265
category: Media
enabled: true
versions:
  - "4.1"
  - "4.2"
execution:
  type: shell-functions
  stages:
    build:
      script: x265_test.sh
      function: build_x265
    start:
      script: x265_test.sh
      function: start_x265_runtime
    test:
      script: x265_test.sh
      function: run_x265_benchmarks
    stop:
      script: x265_test.sh
      function: stop_x265_runtime
  timeout_minutes: 180
outputs:
  official_benchmark:
    path: benchmark_encode.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_x265.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit: fps
    direction: higher_is_better