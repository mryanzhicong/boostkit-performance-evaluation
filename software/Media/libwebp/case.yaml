name: libwebp
category: Media
enabled: true
versions:
  - "1.2.1"
test_tools:
  libwebp:
    version: "与被测软件版本一致"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_libwebp
    start:
      script: scripts/stages/start.sh
      function: start_libwebp_runtime
    test:
      script: scripts/stages/test.sh
      function: run_libwebp_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_libwebp_runtime
  timeout_minutes: 600
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  official_logs:
    path: benchmark_decode.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_libwebp.json
    stage: test
    format: json
    required: true
  reference_summary:
    path: result_bench-libwebp.csv
    stage: test
    format: text
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    group_path: group
    subgroup_path: subgroup
    unit: ms
    direction: lower_is_better
