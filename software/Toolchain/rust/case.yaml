name: rust
category: Toolchain
enabled: true
tags: [compiler, toolchain]
versions: ["1.96.0"]
execution:
  type: command
  entrypoint: rust_test.sh
  expected_outputs:
    - version_info.json
    - benchmark_generic.json
    - micro_benchmark.json
    - results.json
    - results.txt
    - results.log
modes:
  smoke:
    timeout_minutes: 60
    environment: {ITERATIONS: 1}
  full:
    timeout_minutes: 180
    environment: {ITERATIONS: 5}
metrics:
  compile_hello:
    source: results.json
    path: summary.compile_hello_avg_s
    unit: s
    direction: lower_is_better
  matrix_multiply:
    source: results.json
    path: summary.matmul_500x500_avg_s
    unit: s
    direction: lower_is_better
