name: tongsuo
category: Toolchain
enabled: true
versions:
  - "8.5.0"
test_tools:
  openssl_speed:
    version: "8.5.0"
    revision: "apps/speed built from the pinned Tongsuo 8.5.0 source archive (tag 8.5.0, commit 80cfbe3eb194a4d30da90742273c305ad4d096be; upstream OpenSSL 3.5.4 base, TONGSUO 8.5.0)"
  tongsuo_cli:
    version: "8.5.0"
    revision: "apps/openssl version gate: `Tongsuo 8.5.0` (Library: OpenSSL 3.5.4) printed by the build before any measurement"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_tongsuo
    start:
      script: scripts/stages/start.sh
      function: start_tongsuo_runtime
    test:
      script: scripts/stages/test.sh
      function: run_tongsuo_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_tongsuo_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_raw:
    path: benchmark_tongsuo.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
