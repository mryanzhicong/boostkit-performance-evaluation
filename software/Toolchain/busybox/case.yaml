name: busybox
category: Toolchain
enabled: true
versions:
  - "1.38.0"
test_tools:
  busybox_applets:
    version: "1.38.0 (built from the pinned source archive with the upstream defconfig)"
  sha256sum:
    version: "1.38.0 applet"
  sort:
    version: "1.38.0 applet"
  grep:
    version: "1.38.0 applet"
  sed:
    version: "1.38.0 applet"
  awk:
    version: "1.38.0 applet"
  gzip:
    version: "1.38.0 applet"
  tar:
    version: "1.38.0 applet"
  cut:
    version: "1.38.0 applet"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_busybox
    start:
      script: scripts/stages/start.sh
      function: start_busybox_runtime
    test:
      script: scripts/stages/test.sh
      function: run_busybox_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_busybox_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  busybox_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
