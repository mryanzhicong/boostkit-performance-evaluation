name: scikit-learn
category: Toolchain
enabled: true
versions:
  - "1.9.1"
test_tools:
  asv_benchmarks:
    version: "1.9.1"
    revision: "866c0f51e7560ef0303cbcc5f159df5382ea9e3f"
  cpython:
    version: "3.12.16"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_scikit_learn
    start:
      script: scripts/stages/start.sh
      function: start_scikit_learn_runtime
    test:
      script: scripts/stages/test.sh
      function: run_scikit_learn_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_scikit_learn_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
