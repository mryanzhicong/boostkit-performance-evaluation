name: gmp
category: Toolchain
enabled: true
versions:
  - "6.3.0"
test_tools:
  gmp-tune-speed:
    version: "6.3.0 upstream tune/speed benchmark"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_gmp
    start:
      script: scripts/stages/start.sh
      function: start_gmp_runtime
    test:
      script: scripts/stages/test.sh
      function: run_gmp_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_gmp_runtime
  timeout_minutes: 120
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  official_benchmark:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_gmp.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: scenario
