name: openssl
category: Toolchain
enabled: true
versions:
  - "4.1.0"
test_tools:
  openssl:
    version: "4.1.0 (upstream tag openssl-4.1.0, apps/speed.c with -mr)"
  openssl_test_suite:
    version: "4.1.0 (test/run_tests.pl via make test, HARNESS_JOBS=8)"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_openssl
    start:
      script: scripts/stages/start.sh
      function: start_openssl_runtime
    test:
      script: scripts/stages/test.sh
      function: run_openssl_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_openssl_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: speed_result.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
  test_log:
    path: test.log
    stage: test
    format: text
    required: true
  test_summary:
    path: test_summary.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
