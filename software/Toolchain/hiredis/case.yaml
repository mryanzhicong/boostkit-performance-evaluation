name: hiredis
category: Toolchain
enabled: true
versions:
  - "1.5.0"
test_tools:
  hiredis_library:
    version: "1.5.0 (static library built from the pinned source archive)"
  resp_bench:
    version: "case-owned harness that only uses public hiredis APIs"
  upstream_local_tests:
    version: "test.c from the pinned 1.5.0 source archive (server-free subset)"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_hiredis
    start:
      script: scripts/stages/start.sh
      function: start_hiredis_runtime
    test:
      script: scripts/stages/test.sh
      function: run_hiredis_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_hiredis_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  hiredis_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
