name: maven
category: Toolchain
enabled: true
versions:
  - "3.10.0"
test_tools:
  maven:
    version: "3.10.0"
  temurin_jdk:
    version: "21.0.13+9"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_maven
    start:
      script: scripts/stages/start.sh
      function: start_maven_runtime
    test:
      script: scripts/stages/test.sh
      function: run_maven_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_maven_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  maven_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: scenario
