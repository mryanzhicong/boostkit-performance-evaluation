name: ant
category: Toolchain
enabled: true
versions:
  - "1.10.18"
test_tools:
  ant:
    version: "1.10.18"
  openjdk:
    version: "java-21-openjdk-21.0.12.8-4.oe2403sp4 (openEuler 24.03 LTS SP4)"
  container_image:
    version: "openEuler 24.03 LTS SP4"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_ant
    start:
      script: scripts/stages/start.sh
      function: start_ant_runtime
    test:
      script: scripts/stages/test.sh
      function: run_ant_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_ant_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  ant_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: scenario
