name: lua
category: Toolchain
enabled: true
versions:
  - "5.5.1"
test_tools:
  lua:
    version: "5.5.1"
  lua_test_suite:
    version: "5.5.1 (official lua-5.5.1-tests.tar.gz, basic suite with _U=true)"
  lua_benchmarks:
    version: "repository-committed custom workloads, see benchmarks/ and README section 3"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_lua
    start:
      script: scripts/stages/start.sh
      function: start_lua_runtime
    test:
      script: scripts/stages/test.sh
      function: run_lua_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_lua_runtime
  timeout_minutes: 180
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  lua_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: scenario
