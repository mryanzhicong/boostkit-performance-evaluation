name: gdb
category: Toolchain
enabled: true
versions:
  - "18.1"
test_tools:
  GDB:
    version: "18.1"
  GDB testsuite:
    version: "18.1"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_gdb
    start:
      script: scripts/stages/start.sh
      function: start_gdb_runtime
    test:
      script: scripts/stages/test.sh
      function: run_gdb_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_gdb_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  gdb_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true

metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: scenario
