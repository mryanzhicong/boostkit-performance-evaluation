name: pcre
category: Toolchain
enabled: true
versions:
  - "8.45"
test_tools:
  pcretest:
    version: "8.45 (built from the pinned source archive)"
  pcregrep:
    version: "8.45 (built from the pinned source archive)"
  RunTest:
    version: "8.45 upstream test suite shipped in the source archive"
  pcre_bench:
    version: "1.0.0 (case-owned MIT load, compiled against the built libpcre)"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_pcre
    start:
      script: scripts/stages/start.sh
      function: start_pcre_runtime
    test:
      script: scripts/stages/test.sh
      function: run_pcre_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_pcre_runtime
  timeout_minutes: 240
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  pcre_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
