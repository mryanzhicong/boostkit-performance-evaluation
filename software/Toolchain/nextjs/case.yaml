name: nextjs
category: Toolchain
enabled: true
versions:
  - "16.4.3"
test_tools:
  nextjs:
    version: "16.4.3"
  react:
    version: "19.3.1"
  nodejs:
    version: "22.23.4"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_nextjs
    start:
      script: scripts/stages/start.sh
      function: start_nextjs_runtime
    test:
      script: scripts/stages/test.sh
      function: run_nextjs_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_nextjs_runtime
  timeout_minutes: 180
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  nextjs_raw_output:
    path: raw-output.log
    stage: test
    format: text
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: scenario
