name: golang
category: Toolchain
enabled: true
versions:
  - "1.26.7"
  - "1.27.0"
execution:
  type: shell-functions
  stages:
    build:
      script: golang_test.sh
      function: install_golang_binary
    start:
      script: golang_test.sh
      function: start_golang_runtime
    test:
      script: golang_test.sh
      function: run_golang_benchmarks
    stop:
      script: golang_test.sh
      function: stop_golang_runtime
  timeout_minutes: 720
test_tools:
  golang_benchmarks:
    version: master
    revision: 70693762b6a0d7f393892f0ace40979e3cbe5737
outputs:
  official_benchmark:
    path: benchmark_go_bench.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_golang.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
