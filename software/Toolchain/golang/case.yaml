name: golang
category: Toolchain
enabled: true
versions:
  - "1.26.9"
test_tools:
  bent:
    version: "v0.0.0-20261009192853-4a545adeb0d5"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_golang
    start:
      script: scripts/stages/start.sh
      function: start_golang_runtime
    test:
      script: scripts/stages/test.sh
      function: run_golang_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_golang_runtime
  timeout_minutes: 720
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  bent_console:
    path: bent-run.log
    stage: test
    format: text
    required: true
  official_benchmark:
    path: benchmark_go_bench.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_golang.json
    stage: test
    format: json
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
