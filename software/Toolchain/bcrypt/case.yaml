name: bcrypt
category: Toolchain
enabled: true
versions:
  - "6.0.0"
test_tools:
  node:
    version: "22.23.4"
  bcrypt:
    version: "6.0.0"
execution:
  type: shell-functions
  stages:
    build:
      script: scripts/builders/dispatch.sh
      function: build_bcrypt
    start:
      script: scripts/stages/start.sh
      function: start_bcrypt_runtime
    test:
      script: scripts/stages/test.sh
      function: run_bcrypt_benchmarks
    stop:
      script: scripts/stages/stop.sh
      function: stop_bcrypt_runtime
  timeout_minutes: 120
outputs:
  build_variant:
    path: build_variant.json
    stage: build
    format: json
    required: true
  benchmark_result:
    path: results.json
    stage: test
    format: json
    required: true
  run_samples:
    path: runs
    stage: test
    format: directory
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit_path: unit
    direction_path: direction
    group_path: group
    subgroup_path: subgroup
