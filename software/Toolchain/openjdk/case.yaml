name: openjdk
category: Toolchain
enabled: true
versions:
  - "25.0.4.1"
execution:
  type: shell-functions
  stages:
    build:
      script: openjdk_test.sh
      function: build_openjdk
    start:
      script: openjdk_test.sh
      function: start_openjdk_runtime
    test:
      script: openjdk_test.sh
      function: run_openjdk_benchmarks
    stop:
      script: openjdk_test.sh
      function: stop_openjdk_runtime
  timeout_minutes: 240
environment:
  OPENJDK_OFFLINE_DIR: /home/runner/software/openjdk
  JTREG_VERSION: "8.3+1"
  JTREG_TEST_CASE: test/jdk/java/lang/String/StringRepeat.java
outputs:
  jtreg_output:
    path: jtreg-output.log
    stage: test
    format: text
    required: true
  jtreg_result:
    path: benchmark_openjdk.json
    stage: test
    format: json
    required: true
  jtreg_report:
    path: jtreg-report
    stage: test
    format: directory
    required: true
metrics:
  source: jtreg_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit: s
    direction: lower_is_better
