name: openjdk
category: Toolchain
enabled: true
versions:
  - "25.0.2"
  - "26.0.2.1"
execution:
  type: shell-functions
  stages:
    build:
      script: openjdk_test.sh
      function: build_openjdk
    start:
      script: openjdk_test.sh
      function: start_openjdk_runtime
    test:
      script: openjdk_test.sh
      function: run_openjdk_benchmarks
    stop:
      script: openjdk_test.sh
      function: stop_openjdk_runtime
  timeout_minutes: 240
environment:
  OPENJDK_OFFLINE_DIR: /home/runner/software/openjdk
  OPENJDK_JMH_VERSION: "1.37"
  OPENJDK_JAVA_OPTIONS: --add-opens=java.base/java.io=ALL-UNNAMED
  OPENJDK_BENCH_CLASSES: "org.openjdk.bench.java.lang.ArrayCopy org.openjdk.bench.java.lang.ArrayClone org.openjdk.bench.java.lang.StringDecode org.openjdk.bench.java.lang.StringEncode org.openjdk.bench.java.lang.StringBuilders org.openjdk.bench.java.lang.ArraysSort org.openjdk.bench.java.util.HashMapBench"
  OPENJDK_BENCH_SOURCES: "test/micro/org/openjdk/bench/java/lang/ArrayCopy.java test/micro/org/openjdk/bench/java/lang/ArrayClone.java test/micro/org/openjdk/bench/java/lang/StringDecode.java test/micro/org/openjdk/bench/java/lang/StringEncode.java test/micro/org/openjdk/bench/java/lang/StringBuilders.java test/micro/org/openjdk/bench/java/util/ArraysSort.java test/micro/org/openjdk/bench/java/util/HashMapBench.java"
outputs:
  official_benchmark:
    path: benchmark_micro.txt
    stage: test
    format: text
    required: true
  benchmark_result:
    path: benchmark_openjdk.json
    stage: test
    format: json
    required: true
  raw_jmh_result:
    path: jmh-result.json
    stage: test
    format: text
    required: true
  benchmark_selection:
    path: benchmark_list.txt
    stage: start
    format: text
    required: true
metrics:
  source: benchmark_result
  collection:
    path: results
    name_path: source_name
    value_path: value
    unit: us
    direction: lower_is_better
