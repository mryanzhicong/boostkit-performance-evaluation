name: Recover x265 cross-architecture summary
run-name: "Recover x265 summary - ${{ inputs.x86_run_id }} and ${{ inputs.arm_run_id }}"

on:
  workflow_dispatch:
    inputs:
      x86_run_id:
        description: "Run ID of the x86_64 result retained on the production x86 runner"
        required: true
        default: "40516025943-1"
        type: string
      x86_result_directory:
        description: "Original x86_64 result directory name in OBS"
        required: true
        default: "2026-10-27-21-53-16_40516025943-1"
        type: string
      arm_run_id:
        description: "Run ID of the aarch64 result already in OBS"
        required: true
        default: "40294324387-1"
        type: string
      arm_result_directory:
        description: "Original aarch64 result directory name in OBS"
        required: true
        default: "2026-10-26-16-44-12_40294324387-1"
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: Generate summary from existing x265 results
    runs-on: [self-hosted, PERF_RUNNER_X86_64]
    timeout-minutes: 120
    steps:
      - name: Preserve x86_64 result before checkout
        id: preserve
        shell: bash
        env:
          X86_RUN_ID: ${{ inputs.x86_run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          run_id = os.environ["X86_RUN_ID"]
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          temporary = Path(os.environ["RUNNER_TEMP"])
          roots = [
              workspace / ".perf-output" / "Media" / "x265" / "4.2" / "x86_64" / run_id,
              *sorted(temporary.glob("x265-recovery.*")),
              Path("/home/runner/boostkit-perf-result"),
          ]
          for root in roots:
              if not root.is_dir():
                  continue
              candidates = [root / "normalized_result.json"]
              if root.name == "boostkit-perf-result":
                  candidates.extend(root.rglob("normalized_result.json"))
              for normalized in candidates:
                  if not normalized.is_file():
                      continue
                  result = json.loads(normalized.read_text(encoding="utf-8"))
                  if (result.get("run_id"), result.get("architecture")) != (run_id, "x86_64"):
                      continue
                  snapshot = Path(tempfile.mkdtemp(prefix="x265-recovery.", dir=temporary))
                  shutil.copytree(normalized.parent, snapshot, dirs_exist_ok=True)
                  print(f"Found x86_64 result at {normalized.parent}")
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                      print(f"path={snapshot}", file=output)
                  raise SystemExit(0)
          print("::error::No retained x86_64 normalized result found in workspace, Runner temp, or persistent result root")
          raise SystemExit(1)
          PY

      - uses: actions/checkout@v4
        with:
          clean: false
        env:
          http_proxy: ${{ secrets.PERF_PROXY }}
          https_proxy: ${{ secrets.PERF_PROXY }}
          no_proxy: localhost,127.0.0.1,::1

      - name: Install OBS download dependency
        shell: bash
        env:
          http_proxy: ${{ secrets.PERF_PROXY }}
          https_proxy: ${{ secrets.PERF_PROXY }}
          no_proxy: localhost,127.0.0.1,::1
        run: |
          dependency_dir="${RUNNER_TEMP}/boostkit-obs-recovery-deps"
          python3 -m pip install \
            --disable-pip-version-check --no-input --no-cache-dir \
            --trusted-host mirrors.huaweicloud.com \
            -i https://mirrors.huaweicloud.com/repository/pypi/simple \
            --target "${dependency_dir}" "esdk-obs-python"
          echo "PYTHONPATH=${dependency_dir}" >> "${GITHUB_ENV}"

      - name: Download existing aarch64 result from OBS
        id: download_arm
        shell: bash
        env:
          OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          OBS_PREFIX: ${{ secrets.OBS_PREFIX }}
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_SECURITY_TOKEN: ${{ secrets.OBS_SECURITY_TOKEN }}
          PERF_PROXY: ${{ secrets.PERF_PROXY }}
          ARM_RUN_ID: ${{ inputs.arm_run_id }}
          ARM_RESULT_DIRECTORY: ${{ inputs.arm_result_directory }}
        run: |
          printf '%s\n' '{"include":[{"category":"Media","software":"x265","version":"4.2","arch":"aarch64"}]}' \
            > "${RUNNER_TEMP}/x265-recovery-matrix.json"
          python3 .github/scripts/obs_transfer.py download-results \
            --destination "${RUNNER_TEMP}/x265-recovery-input" \
            --run-id "${ARM_RUN_ID}" \
            --result-directory "${ARM_RESULT_DIRECTORY}" \
            --matrix "${RUNNER_TEMP}/x265-recovery-matrix.json"

      - name: Add preserved x86_64 result
        id: add_x86
        shell: bash
        env:
          X86_SNAPSHOT: ${{ steps.preserve.outputs.path }}
        run: |
          target="${RUNNER_TEMP}/x265-recovery-input/Media/x265/4.2/x86_64"
          mkdir -p "${target}"
          cp -a "${X86_SNAPSHOT}/." "${target}/"

      - name: Generate and validate cross-architecture report
        id: compare
        shell: bash
        run: |
          python3 .github/scripts/recover_x265_subgroups.py \
            --input-root "${RUNNER_TEMP}/x265-recovery-input"
          python3 framework/generate_comparison.py \
            --input-root "${RUNNER_TEMP}/x265-recovery-input" \
            --output-dir "${RUNNER_TEMP}/x265-recovery-report"
          python3 -c 'import json, pathlib, sys; report = json.loads((pathlib.Path(sys.argv[1]) / "combined-report.json").read_text()); assert report["summary"]["comparisons"] == 1, "expected one x265 cross-architecture comparison"' \
            "${RUNNER_TEMP}/x265-recovery-report"

      - name: Publish recovered summary
        if: always() && steps.add_x86.outcome == 'success'
        shell: bash
        env:
          X86_RUN_ID: ${{ inputs.x86_run_id }}
          ARM_RUN_ID: ${{ inputs.arm_run_id }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          printf 'Recovered x265 4.2 summary from x86_64 run `%s` and aarch64 run `%s`.\n\n' \
            "${X86_RUN_ID}" "${ARM_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${COMPARE_OUTCOME}" == success ]]; then
            cat "${RUNNER_TEMP}/x265-recovery-report/combined-report.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '这两次运行未通过跨架构可比性校验；以下仅展示各自原始报告，不计算相对性能。' \
              >> "${GITHUB_STEP_SUMMARY}"
            for architecture in x86_64 aarch64; do
              report="${RUNNER_TEMP}/x265-recovery-input/Media/x265/4.2/${architecture}/report.md"
              if [[ -s "${report}" ]]; then
                printf '\n## %s 原始报告\n\n' "${architecture}" >> "${GITHUB_STEP_SUMMARY}"
                cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
              fi
            done
          fi
