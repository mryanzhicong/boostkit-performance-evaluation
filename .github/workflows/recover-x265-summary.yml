name: Recover x265 cross-architecture summary
run-name: "Recover x265 summary - ${{ inputs.x86_run_id }} and ${{ inputs.arm_run_id }}"

on:
  workflow_dispatch:
    inputs:
      x86_run_id:
        description: "Run ID of the x86_64 result retained under /home/runner"
        required: true
        default: "40516025943-1"
        type: string
      arm_run_id:
        description: "Run ID of the aarch64 result already in OBS"
        required: true
        default: "40294324387-1"
        type: string
      arm_result_directory:
        description: "Original aarch64 result directory name in OBS"
        required: true
        default: "2026-10-26-16-44-12_40294324387-1"
        type: string

permissions:
  contents: read

jobs:
  preserve_x86:
    name: Preserve existing x86_64 normalized result
    runs-on: [self-hosted, PERF_RUNNER_X86_64]
    timeout-minutes: 15
    steps:
      - name: Validate retained result without checkout
        shell: bash
        env:
          X86_RUN_ID: ${{ inputs.x86_run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["X86_RUN_ID"]
          if not run_id or any(character not in "0123456789-" for character in run_id):
              raise SystemExit("invalid x86 run ID")
          path = Path("/home/runner") / run_id / "normalized_result.json"
          result = json.loads(path.read_text(encoding="utf-8"))
          expected = ("Media", "x265", "4.2", "x86_64", run_id)
          actual = tuple(result.get(field) for field in (
              "category", "software", "version", "architecture", "run_id"
          ))
          if actual != expected or result.get("status") != "passed":
              raise SystemExit(f"unexpected x86 result identity or status: {path}")
          print(f"Validated {len(result.get('metrics', {}))} x86 metrics in {path}")
          PY
      - name: Upload compact x86_64 report input
        uses: actions/upload-artifact@v4
        env:
          HTTP_PROXY: ${{ secrets.PERF_PROXY }}
          HTTPS_PROXY: ${{ secrets.PERF_PROXY }}
          NO_PROXY: localhost,127.0.0.1,::1
          NODE_EXTRA_CA_CERTS: /etc/pki/tls/certs/ca-bundle.crt
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: "1"
        with:
          name: x265-recovery-x86-${{ inputs.x86_run_id }}
          path: |
            /home/runner/${{ inputs.x86_run_id }}/normalized_result.json
            /home/runner/${{ inputs.x86_run_id }}/report.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  recover:
    name: Generate summary from existing x265 results
    needs: preserve_x86
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS download dependency
        shell: bash
        run: |
          dependency_dir="${RUNNER_TEMP}/boostkit-obs-recovery-deps"
          python3 -m pip install --disable-pip-version-check --no-input \
            --target "${dependency_dir}" esdk-obs-python
          echo "PYTHONPATH=${dependency_dir}" >> "${GITHUB_ENV}"
      - name: Download compact x86_64 report input
        uses: actions/download-artifact@v4
        with:
          name: x265-recovery-x86-${{ inputs.x86_run_id }}
          path: .perf-output/x265-recovery-input/Media/x265/4.2/x86_64
      - name: Download aarch64 result directly from OBS
        shell: bash
        env:
          OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          OBS_PREFIX: ${{ secrets.OBS_PREFIX }}
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_SECURITY_TOKEN: ${{ secrets.OBS_SECURITY_TOKEN }}
          ARM_RUN_ID: ${{ inputs.arm_run_id }}
          ARM_RESULT_DIRECTORY: ${{ inputs.arm_result_directory }}
        run: |
          printf '%s\n' '{"include":[{"category":"Media","software":"x265","version":"4.2","arch":"aarch64"}]}' \
            > "${RUNNER_TEMP}/x265-recovery-matrix.json"
          python3 .github/scripts/obs_transfer.py download-results \
            --destination .perf-output/x265-recovery-input \
            --run-id "${ARM_RUN_ID}" \
            --result-directory "${ARM_RESULT_DIRECTORY}" \
            --only-file normalized_result.json \
            --only-file report.md \
            --matrix "${RUNNER_TEMP}/x265-recovery-matrix.json"
      - name: Align historical video headings and generate report
        shell: bash
        run: |
          python3 .github/scripts/recover_x265_subgroups.py \
            --input-root .perf-output/x265-recovery-input
          python3 framework/generate_comparison.py \
            --input-root .perf-output/x265-recovery-input \
            --output-dir .perf-output/x265-recovery-report
          python3 -c 'import json, pathlib; report = json.loads(pathlib.Path(".perf-output/x265-recovery-report/combined-report.json").read_text()); assert report["summary"]["comparisons"] == 1, "expected one x265 cross-architecture comparison"'
      - name: Publish recovered summary
        shell: bash
        env:
          X86_RUN_ID: ${{ inputs.x86_run_id }}
          ARM_RUN_ID: ${{ inputs.arm_run_id }}
        run: |
          printf 'Recovered x265 4.2 comparison from x86_64 run `%s` and aarch64 run `%s`.\n\n' \
            "${X86_RUN_ID}" "${ARM_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"
          cat .perf-output/x265-recovery-report/combined-report.md >> "${GITHUB_STEP_SUMMARY}"
