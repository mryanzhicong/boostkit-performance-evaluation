[project]
name = "boostkit-performance-evaluation"
version = "0.1.0"
description = "Cross-architecture performance workflow framework"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["framework/verification"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
